name: Conditional Base Image Build (pic)

on:
  push:
    branches:
      - main
    paths:
      - 'Containerfile'
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      force-rebuild:
        description: 'Force a rebuild and push, ignoring the cache skip'
        type: boolean
        default: false

env:
  IMAGE_NAME: pic

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get upstream base image digest
        id: upstream
        # Skopeo checks the remote metadata without downloading the image layers
        run: |
          # Containerfile is FROM node:lts-alpine - update this if that tag changes
          DIGEST=$(skopeo inspect docker://docker.io/library/node:lts-alpine | jq -r '.Digest')
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Current upstream digest is $DIGEST"

      - name: Get latest npm package versions
        id: packages
        run: |
          PACKAGES=(
            "@earendil-works/pi-coding-agent"
            "@agegr/pi-web"
          )
          VERSIONS=()

          for PACKAGE in "${PACKAGES[@]}"; do
            VERSION=$(curl -fsSL "https://registry.npmjs.org/${PACKAGE}/latest" | jq -er '.version')
            echo "Latest ${PACKAGE} npm version is ${VERSION}"
            VERSIONS+=("$VERSION")
          done

          VERSIONS_STRING=$(IFS=,; echo "${VERSIONS[*]}")
          echo "versions=$VERSIONS_STRING" >> "$GITHUB_OUTPUT"

      - name: Compute cache key
        id: cache-key
        # The key changes whenever the base image, any checked npm package, or a new commit changes.
        # It is used for both restore and save, so a forced rebuild refreshes the same entry
        # that normal scheduled/push runs consult.
        env:
          UPSTREAM_DIGEST: ${{ steps.upstream.outputs.digest }}
          PACKAGE_VERSIONS: ${{ steps.packages.outputs.versions }}
        run: |
          echo "key=pic-${UPSTREAM_DIGEST}-${PACKAGE_VERSIONS}-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Check against previous build
        id: cache
        # Skipped on force-rebuild so the cache always misses and the build runs;
        # the result is still saved under the canonical key below.
        if: github.event.inputs.force-rebuild != 'true'
        uses: actions/cache/restore@v4
        with:
          path: .build-key # Dummy file; content is irrelevant, it only marks that a build happened
          key: ${{ steps.cache-key.outputs.key }}

      - name: Set up Docker Buildx
        # Runs unless the cache hit (nothing changed). On force-rebuild the restore step
        # above is skipped, so cache-hit is empty (not 'true') and these steps run too.
        if: steps.cache.outputs.cache-hit != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.cache.outputs.cache-hit != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        if: steps.cache.outputs.cache-hit != 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
          pull: true

      - name: Create dummy file for cache storage
        if: steps.cache.outputs.cache-hit != 'true'
        # Only reached if the build succeeded - a failed build stops the job before here
        env:
          UPSTREAM_DIGEST: ${{ steps.upstream.outputs.digest }}
          PACKAGE_VERSIONS: ${{ steps.packages.outputs.versions }}
        run: |
          echo "${UPSTREAM_DIGEST} ${PACKAGE_VERSIONS}" > .build-key

      - name: Save cache (only after successful build)
        if: steps.cache.outputs.cache-hit != 'true'
        # Default condition is success(), so a failed build skips this step and the
        # cache key is NOT stored - the next run will build again instead of skipping.
        # Forced runs also save here under the canonical key; if that entry already
        # exists the save is a harmless no-op (logged as a warning).
        uses: actions/cache/save@v4
        with:
          path: .build-key
          key: ${{ steps.cache-key.outputs.key }}
